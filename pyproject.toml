[project]
name = "handcursor-core"
version = "0.1.0"
description = "Hardware-free core of CamCursor: gesture state machine, One Euro smoothing, multi-monitor mapping and multi-camera DLT triangulation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["handcursor_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E221", "E241"]  # aligned assignments / columns in test fixtures are intentional

[tool.ruff.lint.isort]
known-first-party = ["handcursor_core"]
